# Workflow adapted from pachadotdev/ghacoveragebadge
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          coverage <- covr::package_coverage(quiet = FALSE)
          percent <- round(covr::percent_coverage(coverage))
          cat("Coverage:", percent, "%\n")

          if (percent >= 90) {
            color <- "brightgreen"
          } else if (percent >= 80) {
            color <- "green"
          } else if (percent >= 70) {
            color <- "yellowgreen"
          } else if (percent >= 60) {
            color <- "yellow"
          } else if (percent >= 50) {
            color <- "orange"
          } else {
            color <- "red"
          }

          writeLines(as.character(percent), "coverage_percent.txt")
          writeLines(color, "coverage_color.txt")
        shell: Rscript {0}

      - name: Generate coverage badge
        run: |
          COVERAGE=$(cat coverage_percent.txt)
          COVERAGE_COLOR=$(cat coverage_color.txt)

          mkdir -p badges
          curl --fail --silent --show-error --location --retry 3 "https://raw.githubusercontent.com/pachadotdev/ghacoveragebadge/refs/heads/main/badges/${COVERAGE_COLOR}.svg" --output badges/coverage.svg
          sed -i "s/{{ COVERAGE }}/${COVERAGE}/g" badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          cp badges/coverage.svg "$RUNNER_TEMP/coverage.svg"

          if git ls-remote --exit-code --heads origin coverage; then
            git fetch origin coverage
            git checkout -B coverage FETCH_HEAD
          else
            git checkout --orphan coverage
          fi
          git rm -rf .

          mkdir -p badges
          cp "$RUNNER_TEMP/coverage.svg" badges/coverage.svg
          git add badges/coverage.svg

          if ! git diff --staged --quiet; then
            git commit -m "Update coverage badge"
            git push origin coverage
          else
            echo "No changes to commit"
          fi
